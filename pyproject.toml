[project]
name = "dro-grasp"
version = "0.1.0"
description = "DRO-Grasp: dexterous grasping via robot-object distance matrix prediction"
# Pinned to 3.8 to match the verified `~/miniconda3/envs/ohra` environment this repo
# was trained in. (Everything also resolves on 3.10 if you ever need to move up.)
requires-python = "==3.8.*"

dependencies = [
    # core -- versions are what `pip freeze` reported in the working env, not
    # requirements.txt, which is slightly behind (e.g. pytorch_kinematics 0.7.4 vs 0.7.6).
    "torch==2.4.1",
    "torchvision==0.19.1",
    "pytorch-lightning==2.4.0",
    "pytorch-kinematics==0.7.6",
    "torchmetrics==1.5.2",
    "numpy==1.24.4",
    "scipy==1.10.1",
    "trimesh==4.12.2",
    "networkx==3.1",
    "lxml",              # trimesh/urdf parsing
    "manifold3d==3.4.0", # trimesh boolean ops
    "fpsample==1.0.2",   # farthest-point sampling

    # config + logging
    "hydra-core==1.3.4",
    "omegaconf==2.3.1",
    "wandb==0.24.2",
    "tqdm",
    "termcolor==2.4.0", # colored console output in validation scripts

    # visualization
    "viser==1.0.30",
    "matplotlib==3.7.5",

    # IK layer -- needed by utils/optimization.py for inference/validation
    "cvxpy==1.5.2",
    "cvxpylayers==0.1.6",
    "rtree",             # optional, signed-distance checks
]

[project.optional-dependencies]
# NVIDIA Isaac Gym Preview 4. Not on PyPI -- download the tarball from
#   https://drive.google.com/file/d/16WFp0n6hzqsVXS0XLU0Tb_54wrKEF8ky/view?usp=sharing
# then unpack it into ./third_party/isaacgym (so ./third_party/isaacgym/python/setup.py
# exists) before running `uv sync --extra isaacgym`. Needed by validate.py's
# isaac_main.py subprocess. Requires python <3.9 (matches our 3.8 pin).
isaacgym = ["isaacgym"]

[tool.uv.sources]
isaacgym = { path = "third_party/isaacgym/python", editable = true }

[tool.uv]
# torch 2.4.1 default wheels are cu121, which matches the driver on the L40S box.
# If the new server has a different CUDA, add an index here, e.g.
#   [[tool.uv.index]]
#   name = "pytorch-cu124"
#   url = "https://download.pytorch.org/whl/cu124"
#   explicit = true
